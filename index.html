<!DOCTYPE html>
<html>
    <head>
    </head>
    <body>
        <!-- <div id="editor"></div>
        <script type="module" src="custom.js"></script> -->
        <!-- <button id="getContentBtn">Get Content</button> -->
         <style>
            /* Parent container occupying the full screen or desired width */
            .app-layout {
            display: flex;
            height: 100vh; /* or your preferred height */
            width: 100%;
            overflow: hidden;
            }

            /* Common styling for both sidebars */
            .sidebar {
            width: 250px; /* Adjust the width as needed */
            background-color: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            border-left: 1px solid #e0e0e0;
            padding: 1rem;
            box-sizing: border-box;
            flex-shrink: 0; /* Prevents sidebars from shrinking */
            }

            /* Specific borders if needed */
            .left-sidebar {
            border-right: 1px solid #e0e0e0;
            border-left: none;
            }

            .right-sidebar {
            border-left: 1px solid #e0e0e0;
            border-right: none;
            }

            /* Center area containing the editor takes up all remaining space */
            .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            box-sizing: border-box;
            overflow-y: auto;
            }
         </style>
         <div class="app-layout">
            <!-- Left Sidebar Navigation -->
            <aside class="sidebar left-sidebar">
                <nav>Left Navigation</nav>
            </aside>

            <!-- Central Editor Area -->
            <main class="editor-container">
                <div id="editor" style="height: 500px;"></div>
            </main>

            <!-- Right Sidebar Navigation / Panel -->
            <aside class="sidebar right-sidebar">
                <nav>Right Navigation</nav>
            </aside>
        </div>
        <script type="module" src="custom.js"></script>
    </body>
</html>
