<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schreibly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap&subset=cyrillic"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem('schreibly-theme');
        document.documentElement.setAttribute('data-theme', ['dark', 'white', 'book'].includes(t) ? t : 'white');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'white');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
